name: Deploy Borrowed Eyes Prototype

on:
  push:
    branches:
      - main
    paths:
      - "Prototype/functional-prototype/**"
      - ".github/workflows/deploy-prototype.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Borrowed Eyes prototype
        uses: actions/upload-pages-artifact@v4
        with:
          path: "Prototype/functional-prototype"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
